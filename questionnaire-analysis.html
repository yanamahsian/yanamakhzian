<main>
  <div class="hero-media hero-media--private">
    <div class="hero-media-content">
      <span class="eyebrow">АНКЕТА &mdash; ПРИВАТНЫЙ АНАЛИЗ</span>
      <h2 class="t" data-ru="ПРИВАТНЫЙ АНАЛИЗ"></h2>
    </div>
  </div>
  <div class="container post-hero">
    <div class="q-wrap" style="padding-top:0;">
      <a href="private.html" class="back-link t" data-ru="&larr; PRIVATE"></a>
      <h3 style="font-family:var(--serif); font-weight:340; font-size:20px; color:var(--ink-dim); margin-top:26px;" class="t" data-ru="Передать задачу"></h3>

      <form class="qForm" action="https://formspree.io/f/xjgnypww" method="POST">
        <input type="hidden" name="request_type" value="private_analysis">
        <input type="hidden" name="_subject" value="AN.KI &mdash; Приватный анализ">
        <div class="field">
          <label class="t" data-ru="Имя"></label>
          <input type="text" name="name" required>
        </div>
        <div class="field">
          <label class="t" data-ru="Email"></label>
          <input type="email" name="email" required>
        </div>
        <div class="field">
          <label class="t" data-ru="Что вы передаёте на анализ?"></label>
          <span class="hint t" data-ru="Проект / концепция / текст / продукт / система / другое."></span>
          <input type="text" name="object_type">
        </div>
        <div class="field">
          <label class="t" data-ru="Кратко опишите объект."></label>
          <textarea name="object_description"></textarea>
        </div>
        <div class="field">
          <label class="t" data-ru="В чём состоит проблема?"></label>
          <span class="hint t" data-ru="Что именно вас не устраивает в существующей конструкции?"></span>
          <textarea name="problem_description"></textarea>
        </div>
        <div class="field">
          <label class="t" data-ru="Какой результат вы хотите получить?"></label>
          <textarea name="desired_outcome"></textarea>
        </div>
        <div class="field">
          <label class="t" data-ru="Что уже было сделано или изменено?"></label>
          <textarea name="changes_made"></textarea>
        </div>
        <div class="field">
          <label class="t" data-ru="Есть ли элементы, которые нельзя менять? Почему?"></label>
          <textarea name="fixed_elements"></textarea>
        </div>
        <div class="field">
          <label class="t" data-ru="Приложите все материалы, необходимые для полноценного анализа."></label>
          <span class="hint t" data-ru="Файлы / ссылки."></span>
          <input type="text" name="materials">
        </div>
        <div class="field">
          <label class="t" data-ru="Есть ли срок, который необходимо учитывать?"></label>
          <input type="text" name="deadline">
        </div>
        <div class="field">
          <label class="t" data-ru="Есть ли что-то существенное, о чём я не спросила?"></label>
          <textarea name="additional_notes"></textarea>
        </div>
        <div class="field-check">
          <input type="checkbox" id="agree" name="price_agreement" value="Да" required>
          <label class="t" for="agree" data-ru="Я понимаю, что стоимость приватного анализа начинается от &euro;5 000 и определяется после рассмотрения материалов."></label>
        </div>
        <button type="submit" class="q-submit t" data-ru="ПЕРЕДАТЬ НА РАССМОТРЕНИЕ &rarr;"></button>
        <div class="q-confirm">
          <p class="t" data-ru="ПОЛУЧЕНО."></p>
          <p class="t" data-ru="Материалы переданы на рассмотрение. Если задача подходит для работы, я свяжусь с вами с предложенным форматом, стоимостью и дальнейшим порядком."></p>
        </div>
        <div class="q-error">
          <p class="t" data-ru="Не удалось отправить заявку. Проверьте соединение и попробуйте ещё раз &mdash; введённые данные сохранены."></p>
        </div>
      </form>
    </div>
  </div>
