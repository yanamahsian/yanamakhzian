media: media

content:
  - name: journal
    label: Журнал
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, type, subtitle]
      primary: title
      sort: [date, desc]
    fields:
      - name: title
        label: Заголовок
        type: text
        required: true

      - name: date
        label: Дата
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: type
        label: Тип записи
        type: select
        required: true
        options:
          values:
            - Журнал
            - Разбор
            - Тезис
            - Эссе

      - name: subtitle
        label: Подзаголовок
        type: text
        required: false

      - name: layout
        label: Layout
        type: hidden
        default: post

      - name: body
        label: Текст записи
        type: rich-text
        required: true
