<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} — AN.KI</title>
  <meta name="description" content="{{ page.subtitle | default: 'Запись журнала AN.KI.' }}" />

  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/design.css" />

  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#020616" />

  <script src="/script.js" defer></script>
</head>

<body class="journal-post-page">

  <header class="site-header">
    <div class="header-inner">
      <a class="brand-mini" href="/index.html" aria-label="AN.KI — Главная">
        <img src="/anki-logo.png" alt="AN.KI" />
        <span>AN.KI</span>
      </a>

      <button class="burger-btn"
              type="button"
              data-burger
              aria-label="Меню"
              aria-expanded="false">
        <span class="burger-icon"><span></span></span>
      </button>
    </div>
  </header>

  <div class="nav-overlay" data-nav-overlay></div>

  <aside class="nav-drawer" data-nav-drawer aria-label="Навигация сайта">
    <h3>Навигация</h3>
    <nav class="drawer-nav"></nav>
    <div class="drawer-bottom">Все права защищены.</div>
  </aside>

  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>

  <main class="page fade-in" role="main">
    <article class="journal-post" aria-label="Запись журнала">
      <header class="journal-post-header">
        <div class="journal-post-meta">
          {% if page.type %}
            <span class="journal-post-type">{{ page.type }}</span>
          {% endif %}

          {% if page.date %}
            <time class="journal-post-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">
              {{ page.date | date: "%-d %B %Y" }}
            </time>
          {% endif %}
        </div>

        <h1 class="journal-post-title">{{ page.title }}</h1>

        {% if page.subtitle %}
          <p class="journal-post-subtitle">{{ page.subtitle }}</p>
        {% endif %}
      </header>

      <div class="journal-post-body">
        {{ content }}
      </div>

      <footer class="journal-post-footer">
        <div class="panel-actions" style="margin-top: 28px;">
          <a class="panel-btn" href="/journal.html">К журналу</a>
          <a class="panel-btn" href="/index.html">На главную</a>
        </div>
      </footer>
    </article>
  </main>

  <footer class="footer">
    <p>© 2025 AN.KI by Yana Makhzian</p>
  </footer>

</body>
</html>
