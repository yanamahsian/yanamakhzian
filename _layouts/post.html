<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} — AN.KI</title>
  <meta name="description" content="{{ page.subtitle | default: page.title }}" />

  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/design.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <script src="/script.js" defer></script>

  <style>
    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      background: #ffffff !important;
      color: #111111 !important;
    }

    body.journal-post-page {
      background: #ffffff !important;
      color: #111111 !important;
      font-family: Georgia, "Times New Roman", serif;
    }

    .journal-post-page #stars,
    .journal-post-page .nebula {
      display: none !important;
    }

    .journal-post-page .site-header {
      background: rgba(255,255,255,0.96) !important;
      border-bottom: 1px solid rgba(17,17,17,0.08) !important;
      backdrop-filter: blur(8px);
    }

    .journal-post-page .brand-mini span {
      color: #4f4f4f !important;
    }

    .journal-post-page .burger-btn {
      border: 1px solid rgba(17,17,17,0.14) !important;
      background: transparent !important;
    }

    .journal-post-page .burger-icon::before,
    .journal-post-page .burger-icon::after,
    .journal-post-page .burger-icon span {
      background: #111111 !important;
    }

    .journal-post-page .nav-overlay {
      background: rgba(0,0,0,0.34) !important;
    }

    .journal-post-page .nav-drawer {
      background: #ffffff !important;
      border-left: 1px solid rgba(17,17,17,0.10) !important;
    }

    .journal-post-page .nav-drawer h3,
    .journal-post-page .drawer-bottom {
      color: #5c5c5c !important;
    }

    .journal-post-page .drawer-nav a {
      color: #111111 !important;
      border: 1px solid rgba(17,17,17,0.10) !important;
      background: transparent !important;
    }

    .journal-post-page .drawer-nav a:hover,
    .journal-post-page .drawer-nav a.active {
      color: #111111 !important;
      border-color: rgba(17,17,17,0.28) !important;
    }

    .post-main {
      width: 100%;
      max-width: none;
      margin: 0;
      padding: 0;
      background: #ffffff !important;
    }

    .post-wrap {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 72px 24px 48px;
      background: #ffffff !important;
    }

    .post-type {
      margin: 0 0 14px;
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #7a7a7a !important;
    }

    .post-title {
      margin: 0 0 18px;
      font-size: 58px;
      line-height: 0.98;
      font-weight: 500;
      letter-spacing: -0.04em;
      color: #111111 !important;
    }

    .post-subtitle {
      margin: 0 0 40px;
      font-size: 20px;
      line-height: 1.75;
      color: #444444 !important;
      max-width: 680px;
    }

    .post-body {
      font-size: 22px;
      line-height: 1.9;
      color: #111111 !important;
    }

    .post-body p {
      margin: 0 0 1.4em;
    }

    .post-body h2,
    .post-body h3 {
      margin: 1.8em 0 0.7em;
      font-weight: 500;
      line-height: 1.2;
      color: #111111 !important;
    }

    .post-actions {
      margin-top: 44px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .post-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      min-height: 42px;
      padding: 10px 18px;
      border: 1px solid rgba(17,17,17,0.16);
      color: #111111 !important;
      text-decoration: none;
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      font-size: 12px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      background: #ffffff !important;
    }

    .post-link:hover {
      background: #efefeb !important;
      border-color: rgba(17,17,17,0.28) !important;
    }

    .journal-post-page .footer {
      max-width: 760px;
      margin: 10px auto 40px;
      padding: 0 24px;
      color: #777777 !important;
      font-size: 12px;
      border-top: 1px solid rgba(17,17,17,0.08);
      padding-top: 16px;
      background: #ffffff !important;
    }

    @media (max-width: 900px) {
      .post-wrap {
        padding: 44px 18px 34px;
      }

      .post-title {
        font-size: 42px;
      }

      .post-subtitle {
        font-size: 18px;
        line-height: 1.7;
      }

      .post-body {
        font-size: 19px;
        line-height: 1.85;
      }

      .journal-post-page .footer {
        padding: 0 18px;
        padding-top: 16px;
      }
    }
  </style>
</head>

<body class="journal-post-page">

  <header class="site-header">
    <div class="header-inner">
      <a class="brand-mini" href="/index.html" aria-label="AN.KI — Главная">
        <img src="/anki-logo.png" alt="AN.KI" />
        <span>AN.KI</span>
      </a>

      <button class="burger-btn"
              type="button"
              data-burger
              aria-label="Меню"
              aria-expanded="false">
        <span class="burger-icon"><span></span></span>
      </button>
    </div>
  </header>

  <div class="nav-overlay" data-nav-overlay></div>

  <aside class="nav-drawer" data-nav-drawer aria-label="Навигация сайта">
    <h3>Навигация</h3>
    <nav class="drawer-nav"></nav>
    <div class="drawer-bottom">Все права защищены.</div>
  </aside>

  <main class="post-main" role="main">
    <div class="post-wrap">
      {% if page.type %}
        <div class="post-type">{{ page.type }}</div>
      {% endif %}

      <h1 class="post-title">{{ page.title }}</h1>

      {% if page.subtitle and page.subtitle != "" %}
        <div class="post-subtitle">{{ page.subtitle }}</div>
      {% endif %}

      <div class="post-body">
        {{ content }}
      </div>

      <div class="post-actions">
        <a class="post-link" href="/journal.html">К журналу</a>
        <a class="post-link" href="/index.html">На главную</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 AN.KI by Yana Makhzian</p>
  </footer>

</body>
</html>
